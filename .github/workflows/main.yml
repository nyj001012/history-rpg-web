name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_DATABASE: history_rpg_ci
          MARIADB_USER: history
          MARIADB_PASSWORD: history-ci
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - "127.0.0.1::3306/tcp"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - name: Verify schema on MariaDB
        env:
          MARIADB_TEST_DATABASE_URL: mariadb+pymysql://history:history-ci@127.0.0.1:${{ job.services.mariadb.ports[3306] }}/history_rpg_ci
        run: python -m pytest -q tests/test_mariadb.py

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Generate lockfile when absent
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy-placeholder:
    name: Deploy Placeholder
    needs: [backend-test, frontend-test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.backend-test.result == 'success' && needs.frontend-test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy to Vultr K8s via ArgoCD"
