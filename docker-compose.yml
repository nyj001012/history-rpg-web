services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: history_rpg
      MYSQL_USER: history
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-history-dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-history-root-dev}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:latest
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
